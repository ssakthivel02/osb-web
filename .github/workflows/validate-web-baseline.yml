name: Validate Web Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_web_baseline.py
      - run: python scripts/test_web_safety_cases.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Controlled Next.js 15.5.24 security migration
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/batch017-website-productization'
        shell: bash
        run: |
          set -euo pipefail
          npx --yes @next/codemod@15.5.24 next-async-request-api app
          if grep -R -n --include='*.ts' --include='*.tsx' '@next-codemod-error' app; then
            echo 'Next.js codemod left unresolved migration markers.' >&2
            exit 1
          fi
          npm install --save-exact --no-audit --no-fund next@15.5.24 react@19.2.8 react-dom@19.2.8
          npm install --save-dev --save-exact --no-audit --no-fund @types/react@19.2.17 @types/react-dom@19.2.7
          npm run typecheck
          git diff --check
          python - <<'PY'
          import subprocess
          allowed = ('app/', 'package.json', 'package-lock.json')
          lines = subprocess.check_output(['git', 'status', '--porcelain'], text=True).splitlines()
          unexpected = []
          for line in lines:
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              if not (path.startswith('app/') or path in allowed):
                  unexpected.append(path)
          if unexpected:
              raise SystemExit('Unexpected migration paths: ' + ', '.join(unexpected))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app package.json package-lock.json
          if git diff --cached --quiet; then
            echo 'Expected migration changes were not produced.' >&2
            exit 1
          fi
          git commit -m 'build: upgrade Next.js security baseline to 15.5.24'
          git push origin HEAD:${{ github.head_ref }}
      - run: npm ci --no-audit --no-fund
      - run: npm run validate:corpus
      - run: npm run validate:closure
      - run: npm run validate:release
      - run: npm run validate:readiness
      - run: npm run validate:uat-evidence
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:served-export
      - name: Install pinned browser-smoke dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run pinned Chromium interaction smoke
        run: node scripts/validate-browser-smoke.mjs
      - name: Run multi-engine responsive smoke
        run: node scripts/validate-browser-matrix.mjs
