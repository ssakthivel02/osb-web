name: Validate Web Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_web_baseline.py
      - run: python scripts/test_web_safety_cases.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - name: Commit generated dependency lockfile to PR branch
        if: github.event_name == 'pull_request'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then
            echo 'package-lock.json already matches the resolved graph'
            exit 0
          fi
          git commit -m 'build: lock npm dependencies'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - run: npm run validate:corpus
      - run: npm run validate:closure
      - run: npm run validate:release
      - run: npm run validate:readiness
      - run: npm run validate:uat-evidence
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:served-export
      - name: Install pinned browser-smoke dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run pinned Chromium interaction smoke
        run: node scripts/validate-browser-smoke.mjs
      - name: Run multi-engine responsive smoke
        run: node scripts/validate-browser-matrix.mjs
