name: Validate Web Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact candidate checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "Expected candidate SHA: ${EXPECTED_SHA}"
          echo "Checked-out HEAD SHA: ${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_web_baseline.py
      - run: python scripts/test_web_safety_cases.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - name: Generate lockfile with controlled security override
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run validate:corpus
      - run: npm run validate:closure
      - run: npm run validate:release
      - run: npm run validate:readiness
      - run: npm run validate:uat-evidence
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:served-export
      - name: Install pinned browser-smoke dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run pinned Chromium interaction smoke
        run: node scripts/validate-browser-smoke.mjs
      - name: Run multi-engine responsive smoke
        run: node scripts/validate-browser-matrix.mjs
      - name: Commit generated lockfile only
        if: github.event_name == 'pull_request'
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          STAGED="$(git diff --cached --name-only)"
          if [ -z "${STAGED}" ]; then
            echo "Generated lockfile already matches repository; no handoff commit needed."
            exit 0
          fi
          test "${STAGED}" = "package-lock.json"
          git commit -m "chore: lock patched PostCSS dependency graph"
          git push origin "HEAD:${HEAD_REF}"
