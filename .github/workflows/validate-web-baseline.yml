name: Validate Web Baseline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_web_baseline.py
      - run: python scripts/test_web_safety_cases.py
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package.json
      - run: npm install --no-audit --no-fund
      - run: npm run validate:corpus
      - run: npm run validate:closure
      - run: npm run validate:release
      - run: npm run validate:readiness
      - run: npm run validate:uat-evidence
      - run: npm run typecheck
      - run: npm run build
      - run: npm run validate:served-export
      - name: Install pinned browser-smoke dependency
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium firefox webkit
      - name: Run pinned Chromium interaction smoke
        run: node scripts/validate-browser-smoke.mjs
      - name: Run multi-engine responsive smoke
        run: node scripts/validate-browser-matrix.mjs
